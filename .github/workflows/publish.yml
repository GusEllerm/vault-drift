# Publish to PyPI on a version tag, via PyPI trusted publishing (no token stored anywhere).
# One-time setup on PyPI: project livedocs → Publishing → add GitHub publisher
#   owner GusEllerm, repository vault-drift, workflow publish.yml, environment pypi.
# Release: bump `version` in pyproject.toml, commit, `git tag v0.1.1 && git push --tags`.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always
