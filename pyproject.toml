[project]
name = "livedocs"
version = "0.1.3"
description = "Notes that know when the code moved on: hash-anchored live docs with a git commit gate, over Fiberplane drift."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["documentation", "drift", "agents", "obsidian", "git-hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/GusEllerm/vault-drift"

[project.scripts]
livedocs = "livedocs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livedocs"]

[tool.hatch.build.targets.sdist]
# The package is the tool; the vault, results and testbench stay in the repository.
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", ".pre-commit-hooks.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
